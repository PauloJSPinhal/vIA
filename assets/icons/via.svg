<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   viewBox="0 0 224 230"
   width="224"
   height="230"
   version="1.1"
   id="svg20"
   xmlns="http://www.w3.org/2000/svg"
   xmlns:svg="http://www.w3.org/2000/svg">
  <defs
     id="defs9">
    <!-- Gradiente verde-esmeralda do 'v' até ao nó ciano -->
    <linearGradient
       id="vGrad"
       x1="60.080902"
       y1="116.49792"
       x2="121.98244"
       y2="107.65484"
       gradientTransform="matrix(0.96120396,0,0,1.0403619,-16,-14)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#22c55e"
         id="stop1" />
      <stop
         offset="65%"
         stop-color="#10b981"
         id="stop2" />
      <stop
         offset="100%"
         stop-color="#22d3ee"
         id="stop3" />
    </linearGradient>
    <!-- Gradiente ciano para o 'I' -->
    <linearGradient
       id="iGrad"
       x1="279.24591"
       y1="47.513676"
       x2="279.24591"
       y2="79.041443"
       gradientTransform="matrix(0.44405304,0,0,2.2519833,-16,-14)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#22d3ee"
         id="stop4" />
      <stop
         offset="100%"
         stop-color="#0ea5e9"
         id="stop5" />
    </linearGradient>
    <!-- Gradiente ciano -> azul-lavanda do 'A' -->
    <linearGradient
       id="aGrad"
       x1="136.53001"
       y1="169.84518"
       x2="210.10059"
       y2="105.47094"
       gradientTransform="matrix(0.98952605,0,0,1.0105848,-16,-14)"
       gradientUnits="userSpaceOnUse">
      <stop
         offset="0%"
         stop-color="#38bdf8"
         id="stop6" />
      <stop
         offset="35%"
         stop-color="#6366f1"
         id="stop7" />
      <stop
         offset="100%"
         stop-color="#818cf8"
         id="stop8" />
    </linearGradient>
    <!-- Brilho suave do nó de rede -->
    <filter
       id="nodeGlow"
       x="-0.46875"
       y="-0.55555556"
       width="1.9375"
       height="2.1111111">
      <feGaussianBlur
         stdDeviation="5"
         result="blur"
         id="feGaussianBlur8" />
      <feMerge
         id="feMerge9">
        <feMergeNode
           in="blur"
           id="feMergeNode8" />
        <feMergeNode
           in="SourceGraphic"
           id="feMergeNode9" />
      </feMerge>
    </filter>
  </defs>
  <!-- Sombra de base discreta -->
  <rect
     x="0"
     y="6"
     width="224"
     height="224"
     rx="22"
     fill="#94a3b8"
     opacity="0.45"
     id="rect9" />
  <!-- Moldura exterior da janela de terminal -->
  <rect
     x="0"
     y="0"
     width="224"
     height="224"
     rx="20"
     fill="#2b313a"
     id="rect10" />
  <!-- Interior escuro -->
  <rect
     x="6"
     y="6"
     width="212"
     height="212"
     rx="15"
     fill="#11141a"
     id="rect11" />
  <!-- Botões superiores estilo janela -->
  <circle
     cx="22"
     cy="22"
     r="4.5"
     fill="#ef4444"
     id="circle11" />
  <circle
     cx="37"
     cy="22"
     r="4.5"
     fill="#facc15"
     id="circle12" />
  <circle
     cx="52"
     cy="22"
     r="4.5"
     fill="#22c55e"
     id="circle13" />
  <!-- Letra 'v' com braço direito curvo a apontar para o nó -->
  <path
     d="m 29,89 h 17 l 21,49 23,-47 c 5,-9 12,-13 22,-16 l 2,4 c -8,5 -12,11 -16,21 l -31,67 z"
     fill="url(#vGrad)"
     id="path13"
     style="fill:url(#vGrad)" />
  <!-- Letra 'I' com topo arredondado e corte oblíquo na base -->
  <path
     d="m 108,104 c 0,-7 6,-11 14,-11 v 52 c 0,9 -6,15 -14,19 z"
     fill="url(#iGrad)"
     id="path14"
     style="fill:url(#iGrad)" />
  <!-- Letra 'A' sem barra horizontal com arranque curvo na base do 'I' -->
  <path
     d="m 110,166 c 12,-5 19,-13 25,-27 l 28,-65 38,89 h -16 l -22,-53 -18,41 c -7,14 -19,18 -35,15 z"
     fill="url(#aGrad)"
     id="path15"
     style="fill:url(#aGrad)" />
  <!-- Nó de rede em X sobre o 'I' com brilho -->
  <g
     filter="url(#nodeGlow)"
     id="g20"
     transform="translate(-16,-14)">
    <line
       x1="120"
       y1="81"
       x2="140"
       y2="97"
       stroke="#22d3ee"
       stroke-width="2.6"
       stroke-linecap="round"
       id="line15" />
    <line
       x1="140"
       y1="81"
       x2="120"
       y2="97"
       stroke="#22d3ee"
       stroke-width="2.6"
       stroke-linecap="round"
       id="line16" />
    <circle
       cx="120"
       cy="81"
       r="2.8"
       fill="#22d3ee"
       id="circle16" />
    <circle
       cx="140"
       cy="81"
       r="2.8"
       fill="#22d3ee"
       id="circle17" />
    <circle
       cx="120"
       cy="97"
       r="2.8"
       fill="#22d3ee"
       id="circle18" />
    <circle
       cx="140"
       cy="97"
       r="2.8"
       fill="#22d3ee"
       id="circle19" />
    <circle
       cx="130"
       cy="89"
       r="5.5"
       fill="#67e8f9"
       id="circle20" />
  </g>
</svg>
