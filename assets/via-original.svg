<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Gradiente verde-esmeralda do 'v' até ao nó ciano -->
    <linearGradient id="vGrad" x1="15%" y1="35%" x2="85%" y2="25%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="65%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Gradiente ciano para o 'I' -->
    <linearGradient id="iGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>

    <!-- Gradiente ciano -> azul-lavanda do 'A' -->
    <linearGradient id="aGrad" x1="10%" y1="90%" x2="90%" y2="20%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Brilho suave do nó de rede -->
    <filter id="nodeGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Sombra de base discreta -->
  <rect x="16" y="20" width="224" height="224" rx="22" fill="#94a3b8" opacity="0.45" />

  <!-- Moldura exterior da janela de terminal -->
  <rect x="16" y="14" width="224" height="224" rx="20" fill="#2b313a" />
  <!-- Interior escuro -->
  <rect x="22" y="20" width="212" height="212" rx="15" fill="#11141a" />

  <!-- Botões superiores estilo janela -->
  <circle cx="38" cy="36" r="4.5" fill="#ef4444" />
  <circle cx="53" cy="36" r="4.5" fill="#facc15" />
  <circle cx="68" cy="36" r="4.5" fill="#22c55e" />

  <!-- Letra 'v' com braço direito curvo a apontar para o nó -->
  <path d="M 45 103 L 62 103 L 83 152 L 106 105 C 111 96, 118 92, 128 89 L 130 93 C 122 98, 118 104, 114 114 L 83 181 Z" fill="url(#vGrad)" />

  <!-- Letra 'I' com topo arredondado e corte oblíquo na base -->
  <path d="M 124 118 C 124 111, 130 107, 138 107 L 138 159 C 138 168, 132 174, 124 178 Z" fill="url(#iGrad)" />

  <!-- Letra 'A' sem barra horizontal com arranque curvo na base do 'I' -->
  <path d="M 126 180 C 138 175, 145 167, 151 153 L 179 88 L 217 177 L 201 177 L 179 124 L 161 165 C 154 179, 142 183, 126 180 Z" fill="url(#aGrad)" />

  <!-- Nó de rede em X sobre o 'I' com brilho -->
  <g filter="url(#nodeGlow)">
    <line x1="120" y1="81" x2="140" y2="97" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round" />
    <line x1="140" y1="81" x2="120" y2="97" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round" />
    <circle cx="120" cy="81" r="2.8" fill="#22d3ee" />
    <circle cx="140" cy="81" r="2.8" fill="#22d3ee" />
    <circle cx="120" cy="97" r="2.8" fill="#22d3ee" />
    <circle cx="140" cy="97" r="2.8" fill="#22d3ee" />
    <circle cx="130" cy="89" r="5.5" fill="#67e8f9" />
  </g>
</svg>